pid /tmp/nginx.pid;
events {}
http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location = /api/contact { proxy_pass http://web:3000; proxy_set_header Host $http_host; }
    location ^~ /api/chat { proxy_pass http://web:3000; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 120s; proxy_set_header Host $http_host; }
    location /api/ {
      proxy_pass http://api:8000/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_buffering off;
      proxy_read_timeout 120s;
    }
    location / { proxy_pass http://web:3000; proxy_set_header Host $http_host; }
  }
}
