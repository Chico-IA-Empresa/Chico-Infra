name: Infra local checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infra-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Infra validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: terraform fmt -check -recursive
      - run: node --test tests/*.test.mjs
      - run: node tests/dev-state-repair-integration.mjs
      - run: bash tests/bootstrap.test.sh
      - name: Reuse verified provider packages within this runner
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-providers"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-providers" >> "$GITHUB_ENV"
      - name: Validate roots without AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap envs/shared envs/dev envs/uat envs/prod; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
          terraform -chdir=envs/dev test
          terraform -chdir=envs/shared test
          for module in network funding oidc data schedules web-service dev-box budgets audit access-log-sink; do
            terraform -chdir="modules/$module" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="modules/$module" validate
            terraform -chdir="modules/$module" test
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.59.1
      - run: tflint --init && tflint --recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tests/config-consumer.test.py
      - run: python tests/proxy-events.test.py
      - run: python tests/dev-database-backup.test.py
      - name: Synthetic PostgreSQL16 database backup and isolated recovery
        env:
          CHICO_DATABASE_INTEGRATION: 'true'
        run: sudo --preserve-env=CHICO_DATABASE_INTEGRATION "$(command -v python)" tests/dev-database-backup-integration.py
  security:
    name: Terraform security
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pip install checkov==3.3.29
      - name: Gate Dev and required foundation with exact reviewed exceptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          for scope in bootstrap shared dev; do
            root="envs/$scope"
            if test "$scope" = bootstrap; then root=bootstrap; fi
            scan_args=()
            if test "$scope" = dev; then scan_args=(--var-file "$GITHUB_WORKSPACE/security/dev-scan.tfvars"); fi
            code=0
            checkov -d "$root" --framework terraform --quiet --skip-download "${scan_args[@]}" -o json > "reports/checkov-$scope-scope.json" || code=$?
            test "$code" -le 1
            node scripts/security-gate.mjs "reports/checkov-$scope-scope.json" "$scope"
          done
      - name: Inventory all blueprints including UAT and Prod
        shell: bash
        run: |
          set -euo pipefail
          code=0
          checkov -d . --framework terraform --quiet --skip-download --skip-path reports -o json > reports/checkov-full.json || code=$?
          test "$code" -le 1
          node -e 'const r=require("./reports/checkov-full.json");if(!r.summary||r.summary.parsing_errors||r.summary.skipped)process.exit(1);console.log("Full repository inventory (includes future UAT/Prod; operational acceptance remains pending):",r.summary)'
