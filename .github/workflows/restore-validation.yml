name: Restore validation metadata checks
on:
  pull_request:
    paths:
      - operations/restore-validation/**
      - operations/dev-database/backup.py
      - tests/restore-validation*
      - .github/workflows/restore-validation.yml
  push:
    branches: [main]
    paths:
      - operations/restore-validation/**
      - operations/dev-database/backup.py
      - tests/restore-validation*
      - .github/workflows/restore-validation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: restore-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    name: PG16 restore validation metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Offline metadata, classification and existing manifest contracts
        run: python tests/restore-validation.test.py
      - name: PostgreSQL16 catalog SQL, shared snapshot and logical comparison
        env:
          CHICO_RESTORE_VALIDATION_INTEGRATION: 'true'
        run: python tests/restore-validation-integration.py
