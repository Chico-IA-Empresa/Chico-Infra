name: Reviewed infrastructure plan
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        required: true
        options: [shared, uat, prod]
permissions:
  contents: read
  id-token: write
concurrency:
  group: infra-${{ inputs.scope }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verify protected scope before requesting AWS credentials
        env:
          GH_TOKEN: ${{ secrets.GH_GOVERNANCE_READ_TOKEN }}
          SCOPE: ${{ inputs.scope }}
        run: node scripts/github-readiness.mjs plan "$SCOPE"
  plan:
    needs: preflight
    if: github.ref == 'refs/heads/main'
    environment: infra-plan-${{ inputs.scope }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: sa-east-1
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Plan without publishing sensitive output
        env:
          BACKEND_CONFIG: ${{ secrets.BACKEND_CONFIG }}
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
          SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="envs/$SCOPE"
          printf '%s' "$BACKEND_CONFIG" > "$root/backend.hcl"
          printf '%s' "$TF_VARS_JSON" > "$root/ci.auto.tfvars.json"
          terraform -chdir="$root" init -input=false -lockfile=readonly -backend-config=backend.hcl >/dev/null
          # Full plans stay ephemeral on the runner: state/plan may contain secrets.
          if terraform -chdir="$root" plan -input=false -lock-timeout=60s -out=review.tfplan > "$RUNNER_TEMP/plan.log" 2>&1; then
            echo 'Plan gerado. Revisão privada e aprovação financeira continuam obrigatórias.'
          else
            echo 'Plan falhou. Inspecionar em sessão privada autorizada; nenhum apply executado.'
            exit 1
          fi
